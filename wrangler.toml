name = "ask"
main = "site/src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[assets]
directory = "./site/public"
binding = "ASSETS"
# الصفحات الرئيسية تمر بالـ Worker فقط ليحوّل النطاق القديم؛ بقية الملفات تُخدم مباشرة
run_worker_first = ["/api/*", "/", "/library", "/rulings"]

# سجلات الخادم: تحفظ تقييمات «هل كانت الإجابة مفيدة؟»
[observability]
enabled = true

[vars]
ANSWER_MODEL = "claude-sonnet-5-5"
QUICK_MODEL = "claude-haiku-5-5"

# حد الأسئلة لكل زائر: 10 طلبات في الدقيقة
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# المفتاح لا يُكتب هنا. يُضاف سراً: npx wrangler secret put ANTHROPIC_API_KEY

# نسخ المعاينة (لكل طلب دمج) تستخدم حداً مستقلاً
[[previews.ratelimits]]
name = "LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }
